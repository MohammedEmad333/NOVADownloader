name: Signed release APK (manual)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  signed-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify tests and build unsigned release
        run: gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Read release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(grep -m1 -E "^[[:space:]]*versionName[[:space:]]+'[^']+'" app/build.gradle | cut -d "'" -f 2)"
          version_code="$(awk '$1 == "versionCode" { print $2; exit }' app/build.gradle)"
          [[ "$version_name" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$version_code" =~ ^[0-9]+$ ]]
          echo "Validated version: $version_name ($version_code)"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Sign and verify APK
        env:
          NOVA_VERSION_NAME: ${{ steps.identity.outputs.version_name }}
          NOVA_VERSION_CODE: ${{ steps.identity.outputs.version_code }}
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in NOVA_KEYSTORE_BASE64 NOVA_KEYSTORE_PASSWORD NOVA_KEY_ALIAS NOVA_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Required signing secret is missing: ${name}" >&2
              exit 1
            fi
          done

          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$unsigned" ]; then
            echo "Unsigned APK missing at $unsigned" >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/nova-release.jks"
          aligned="$RUNNER_TEMP/nova-release-aligned.apk"
          trap 'rm -f "$keystore" "$aligned"' EXIT
          printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          aligner="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          "$aligner" -p -f 4 "$unsigned" "$aligned"
          "$aligner" -c -v 4 "$aligned"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$signer" sign \
            --ks "$keystore" \
            --ks-key-alias "$NOVA_KEY_ALIAS" \
            --ks-pass env:NOVA_KEYSTORE_PASSWORD \
            --key-pass env:NOVA_KEY_PASSWORD \
            --out app/build/outputs/apk/release/nova-release-signed.apk \
            "$aligned"
          signed="app/build/outputs/apk/release/nova-release-signed.apk"
          "$signer" verify --verbose --min-sdk-version 29 "$signed"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$signed")"
          package_line="$(grep -m1 '^package: ' <<< "$badging")"
          for token in "name='com.example.ytdl'" "versionCode='$NOVA_VERSION_CODE'" "versionName='$NOVA_VERSION_NAME'"; do
            if [[ "$package_line" != *"$token"* ]]; then
              echo "Signed APK identity mismatch: $package_line" >&2
              exit 1
            fi
          done
          echo "$package_line"
          # The public certificate fingerprint lets maintainers detect accidental
          # signing-key rotation without exposing the keystore or passwords.
          "$signer" verify --print-certs "$signed" |
            grep -F "Signer #1 certificate SHA-256 digest:" |
            tee app/build/outputs/apk/release/SIGNING_CERT_SHA256.txt
          test -s app/build/outputs/apk/release/SIGNING_CERT_SHA256.txt
          (cd app/build/outputs/apk/release &&
            sha256sum nova-release-signed.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: nova-release-signed-apk
          path: |
            app/build/outputs/apk/release/nova-release-signed.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/SIGNING_CERT_SHA256.txt
          if-no-files-found: error

      # Create a private draft, not a public release. Publish only after the
      # exact signed APK passes the physical-device acceptance checklist.
      - name: Check existing release state
        id: existing_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.identity.outputs.version_name }}"
          status="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [[ "$status" == false ]]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create NOVA draft GitHub Release
        if: steps.existing_release.outputs.already_published != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.identity.outputs.version_name }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: NOVA Downloader ${{ steps.identity.outputs.version_name }}
          draft: true
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            ## NOVA ${{ steps.identity.outputs.version_name }}

            Changes are recorded in the repository README and development roadmap.
            This workflow does not publish new versions automatically: versions after 2.3.0
            remain drafts until signed-APK physical-device acceptance.

            ### Verification
            - Android unit/Robolectric tests and debug/unsigned release builds passed in GitHub Actions.
            - APK package: com.example.ytdl
            - Version: ${{ steps.identity.outputs.version_name }} (versionCode ${{ steps.identity.outputs.version_code }})
            - Minimum Android: 10 (API 29)

            ### Release and verification
            The APK signature, package and version identity, SHA-256 and signing-certificate
            fingerprint are checked by CI. Preserve the established NOVA signing key for upgrades.
            The maintainer must test this signed APK on a supported Android device before
            publishing a new version. See docs/ROADMAP_2_1_TO_3_0.md.
          files: |
            app/build/outputs/apk/release/nova-release-signed.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/SIGNING_CERT_SHA256.txt

      # Only the initial release is auto-published after successful signing.
      # Later releases stay drafts for device acceptance.
      - name: Publish NOVA 2.3.0 first public release
        if: steps.identity.outputs.version_name == '2.3.0' && steps.existing_release.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "v2.3.0" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
