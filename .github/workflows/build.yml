name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # setup-android historically defaulted to the removed SDK package named `tools`.
      # Ask it only to expose sdkmanager, then install current packages explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug and unsigned release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify release APK identity and create debug checksum
        shell: bash
        run: |
          set -euo pipefail
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          debug="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$unsigned"
          test -s "$debug"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$unsigned" |
            grep -F "package: name='com.example.ytdl'"
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
